# ==================================================
#  NightCraft Studio - permission.cfg
#  Tout ce qui concerne les admins et les permissions.
#  Ce fichier doit être chargé AVANT resources.cfg.
# ==================================================

# --- Groupes ---
# Un admin hérite aussi des droits d'un joueur normal.
add_principal group.admin group.user

# Le groupe admin a accès à toutes les commandes, sauf "quit" (éteindre le serveur).
add_ace group.admin command allow
add_ace group.admin command.quit deny

# --- Admins du serveur ---
# Une ligne par admin (identifiant license visible dans txAdmin, fiche du joueur).
add_principal identifier.license:194ce4daedd70b1d841099aee6cba5f6d277a7d0 group.admin
# add_principal identifier.license:LICENSE_DUN_AUTRE_ADMIN group.admin

# --- Droits nécessaires aux ressources ---
# ESX : lui permet de donner automatiquement le bon groupe aux joueurs
# (le groupe de chaque joueur vient de la colonne "group" de la table users).
add_ace resource.es_extended command.add_ace allow
add_ace resource.es_extended command.add_principal allow
add_ace resource.es_extended command.remove_principal allow
add_ace resource.es_extended command.stop allow

# ox_lib : nécessaire pour ox_inventory et les scripts qui utilisent ox_lib.
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
