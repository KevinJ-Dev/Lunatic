# ==================================================
#  NightCraft Studio - resources.cfg
#  Tout ce qui concerne les ressources.
#  L'ordre de démarrage compte : garde les blocs dans cet ordre.
#  Les noms entre crochets doivent être identiques à tes dossiers,
#  à la lettre près (majuscules comprises).
# ==================================================

# --- Réglages lus par les ressources (à laisser AVANT les ensure) ---
setr esx:locale "fr"


# --- Base FiveM (intégrée au serveur) ---
             # à remplacer par ton chat perso quand il est prêt
# ensure spawnmanager      # à décommenter seulement si es_extended le réclame au démarrage

# --- [1_Script] : tes dossiers, dans l'ordre ---
ensure [0_Libs]            # oxmysql, ox_lib et autres librairies
ensure [1_Framework]       # es_extended
ensure [2_Ox]              # ox_inventory et le reste de la suite ox
ensure [3_ESX]             # scripts ESX (métiers, banque, garages, etc.)
ensure [4_NESX]
ensure [5_Standalone]      # scripts qui ne dépendent pas d'ESX
ensure [6_Mappings]
ensure [7_Veicule]
ensure [8_Creation_script] # tes scripts NightCraft en cours de création