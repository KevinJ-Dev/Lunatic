<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Boutique</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="store hidden" id="store">
        <div class="window">
            <header class="head">
                <div class="brand"><span class="logo">L</span><div><b>Boutique</b><span>Lunatic RP</span></div></div>
                <div class="balance" id="balance"></div>
                <button class="close" id="close" title="Fermer (Échap)">✕</button>
            </header>
            <div class="banners" id="banners"></div>
            <div class="body">
                <nav class="nav" id="nav"></nav>
                <main class="main" id="main"></main>
            </div>
        </div>
        <div class="modal hidden" id="modal"></div>
        <div class="toast" id="toast"></div>
    </div>
    <div class="notif hidden" id="notif"></div>
    <script src="app.js"></script>
</body>
</html>
