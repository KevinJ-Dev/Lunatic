<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Location de véhicules</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="rental hidden" id="rental">
        <aside class="panel">
            <header class="head">
                <div><small>Location</small><b id="agency"></b></div>
                <div class="count"><b>Véhicules</b><small id="count"></small></div>
            </header>
            <div class="active hidden" id="active"></div>
            <nav class="tabs" id="tabs"></nav>
            <main class="grid" id="grid"></main>
            <footer class="foot" id="foot"></footer>
        </aside>
        <div class="stage" id="stage">
            <button class="close" id="close" title="Fermer (Échap)">✕</button>
            <div class="cams" id="cams"></div>
            <div class="name" id="name"></div>
            <div class="hint">Clic maintenu et glisser : tourner · Molette : zoom</div>
        </div>
        <div class="toast" id="toast"></div>
    </div>
    <div class="timer hidden" id="timer"><small>Location</small><b id="timer-time">00:00</b></div>

    <!-- Magasins d'articles (LTD, Ammunation…) -->
    <div class="store hidden" id="store">
        <aside class="store-panel">
            <header class="store-banner" id="storeBanner"><img class="store-logo hidden" id="storeLogo" alt=""><b id="storeTitle"></b><small id="storeSub"></small></header>
            <div class="store-tools"><b id="storeToolsTitle">Catalogue</b><input class="store-search" id="storeSearch" placeholder="Rechercher…"></div>
            <nav class="store-tabs hidden" id="storeTabs"></nav>
            <main class="store-grid" id="storeGrid"></main>
            <footer class="store-cart" id="storeCart"></footer>
        </aside>
        <div class="store-toast" id="storeToast"></div>
    </div>
    <!-- Vestiaire des structures : tenues, aperçu sur le personnage -->
    <div class="wardrobe hidden" id="wardrobe">
        <div class="wardrobe-stage" id="wardrobeStage"></div>
        <aside class="store-panel">
            <header class="store-banner" id="wardrobeBanner"><img class="store-logo hidden" id="wardrobeLogo" alt=""><b id="wardrobeTitle"></b><small>Vestiaire</small></header>
            <nav class="store-tabs" id="wardrobeTabs"></nav>
            <main class="store-grid" id="wardrobeGrid"></main>
            <footer class="store-cart" id="wardrobeFoot"></footer>
        </aside>
        <div class="store-toast" id="wardrobeToast"></div>
    </div>
    <!-- Garage des structures : véhicules de service, aperçu à la sortie -->
    <div class="garage hidden" id="garage">
        <div class="wardrobe-stage" id="garageStage"></div>
        <aside class="store-panel">
            <header class="store-banner" id="garageBanner"><img class="store-logo hidden" id="garageLogo" alt=""><b id="garageTitle"></b><small id="garageSub">Garage</small></header>
            <main class="store-grid garage-grid" id="garageGrid"></main>
            <footer class="store-cart" id="garageFoot"></footer>
        </aside>
        <div class="store-toast" id="garageToast"></div>
    </div>
    <script src="app.js"></script>
    <script src="store.js"></script>
    <script src="wardrobe.js"></script>
    <script src="garage.js"></script>
</body>
</html>
