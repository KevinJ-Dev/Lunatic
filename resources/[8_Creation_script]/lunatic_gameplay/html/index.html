<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Gameplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card hidden" id="card">
        <div class="head"><span class="title" id="title"></span><span class="sub" id="sub"></span></div>
        <div class="main">
            <div class="photo" id="photo"></div>
            <div class="fields">
                <div><small id="lLast">Nom</small><b id="last"></b></div>
                <div><small id="lFirst">Prénom(s)</small><b id="first"></b></div>
                <div class="row" id="rowBody">
                    <div><small id="lSex">Sexe</small><b id="sex"></b></div>
                    <div><small id="lHeight">Taille</small><b id="height"></b></div>
                </div>
                <div class="row">
                    <div><small id="lBirth">Né(e) le</small><b id="birth"></b></div>
                    <div id="cellNation"><small id="lNation">Nationalité</small><b id="nation"></b></div>
                </div>
                <div><small id="lNumber">N° du document</small><b id="number" class="mono"></b></div>
                <div class="hidden" id="cellCats"><small id="lCats">Catégories</small><div class="cats" id="cats"></div></div>
            </div>
        </div>
        <div class="foot" id="foot"></div>
    </div>
    <div class="death hidden" id="death">
        <div class="death-shade hidden" id="death-shade"></div>
        <div class="death-stack">
            <div class="death-timer"><b id="death-time">00:00</b><small>Temps restant</small></div>
            <p class="death-info" id="death-info"></p>
            <div class="death-keys">
                <div class="death-key alert" id="death-alert"><kbd>G</kbd><span>Alerter les secours</span></div>
                <div class="death-key rise" id="death-rise"><kbd>E</kbd><span id="death-rise-label">Se relever</span></div>
            </div>
            <div class="death-title" id="death-title">Vous êtes <b>inconscient</b></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
