<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Gameplay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card hidden" id="card">
        <header class="card-head">
            <span class="state">San Andreas</span>
            <span class="doc" id="doc">IDENTIFICATION CARD</span>
            <span class="usa">USA</span>
        </header>
        <div class="card-body">
            <div class="photo" id="photo"></div>
            <div class="fields">
                <div class="line"><small id="lNumber">ID</small><b id="number" class="red"></b></div>
                <div class="line"><small>EXP</small><b id="exp"></b></div>
                <div class="line"><small>LN</small><b id="last"></b></div>
                <div class="line"><small>FN</small><b id="first"></b></div>
                <div class="line"><small>DOB</small><b id="birth" class="red"></b></div>
                <div class="pair">
                    <span><small>SEX</small><b id="sex"></b></span>
                    <span><small>HGT</small><b id="height"></b></span>
                </div>
                <div class="line" id="rowNation"><small>NAT</small><b id="nation"></b></div>
                <div class="pair hidden" id="rowClass">
                    <span><small>CLASS</small><b id="classes"></b></span>
                    <span><small>END</small><b id="ends"></b></span>
                </div>
                <div class="line"><small>ISS</small><b id="iss"></b></div>
            </div>
            <div class="side">
                <div class="seal"><span>★</span><b>SA</b></div>
                <div class="ghost" id="ghost"></div>
            </div>
        </div>
        <footer class="card-foot"><span class="sign" id="sign"></span><span class="dmv">Department of Motor Vehicles · Los Santos</span></footer>
    </div>
    <div class="death hidden" id="death">
        <div class="death-shade hidden" id="death-shade"></div>
        <div class="death-stack">
            <div class="death-timer"><b id="death-time">00:00</b><small>Temps restant</small></div>
            <p class="death-info" id="death-info"></p>
            <div class="death-keys">
                <div class="death-key alert" id="death-alert"><kbd>G</kbd><span>Alerter les secours</span></div>
                <div class="death-key rise" id="death-rise"><kbd>E</kbd><span id="death-rise-label">Se relever</span></div>
            </div>
            <div class="death-title" id="death-title">Vous êtes <b>inconscient</b></div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
