<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Magasin de vêtements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shop hidden" id="shop">
        <aside class="panel">
            <header class="banner" id="banner">
                <span class="brand" id="brand"></span>
                <small id="storeName"></small>
            </header>
            <main class="view" id="view"></main>
            <footer class="cart" id="cart"></footer>
        </aside>
        <div class="tools" id="tools"></div>
        <div class="foot">
            <div class="hint">Clic maintenu et glisser : tourner le personnage</div>
            <nav class="bar" id="bar"></nav>
        </div>
        <div class="toast" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
