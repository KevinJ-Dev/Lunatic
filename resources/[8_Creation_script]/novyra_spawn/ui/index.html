<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novyra · Entrée en ville</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="nv" id="nv">
    <div class="nv-shade"></div>
    <div class="nv-band nv-band--top"></div>
    <div class="nv-band nv-band--bottom"></div>

    <!-- En-tête -->
    <header class="nv-head">
        <div class="nv-brand">
            <div class="nv-mark" id="mark">
                <img id="logo" alt="" hidden>
                <svg id="monogram" viewBox="0 0 48 48" aria-hidden="true">
                    <defs>
                        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/>
                        </linearGradient>
                    </defs>
                    <path d="M24 2 43 13v22L24 46 5 35V13z" fill="none" stroke="url(#g)" stroke-width="2.4"/>
                    <path d="M16 33V15h3.2l9.6 12.6V15H32v18h-3.2L19.2 20.4V33z" fill="#fff"/>
                </svg>
            </div>
            <div class="nv-brand__txt">
                <strong data-bind="serverName"></strong>
                <span data-bind="tagline"></span>
            </div>
        </div>

        <div class="nv-meta">
            <span class="nv-online"><i></i><b data-bind="players">0</b>&nbsp;/&nbsp;<span data-bind="maxPlayers">0</span></span>
            <span class="nv-sep"></span>
            <span class="nv-clock" id="clock">00:00</span>
        </div>
    </header>

    <!-- Centre -->
    <section class="nv-center">
        <img class="nv-biglogo" id="bigLogo" alt="" hidden>
        <p class="nv-hello"><span></span>Bienvenue à Los Santos<span></span></p>
        <h1 class="nv-name" data-bind="name">Prénom Nom</h1>

        <div class="nv-info" id="info">
            <div class="nv-cell">
                <small>Métier</small>
                <span data-bind="job"></span>
            </div>
            <div class="nv-cell">
                <small>Position</small>
                <span data-bind="location"></span>
            </div>
            <div class="nv-cell">
                <small>Liquide</small>
                <span class="nv-num" data-bind="cash"></span>
            </div>
            <div class="nv-cell">
                <small>Banque</small>
                <span class="nv-num" data-bind="bank"></span>
            </div>
        </div>

        <button class="nv-btn" id="enter" type="button">
            <span class="nv-btn__glow"></span>
            <span class="nv-btn__in">
                Rejoindre la ville
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
        </button>
        <p class="nv-key" id="key"><kbd>Entrée</kbd> pour rejoindre</p>
    </section>

    <!-- Pied -->
    <footer class="nv-foot">
        <div class="nv-shot">
            <div class="nv-dots" id="dots"></div>
            <span id="shotLabel">Los Santos</span>
        </div>

        <div class="nv-ticker" id="ticker">
            <div class="nv-ticker__track" id="tickerTrack"></div>
        </div>

        <div class="nv-discord" id="discord">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.3 5.3A16.7 16.7 0 0 0 15.1 4l-.5 1a15.4 15.4 0 0 0-5.2 0L8.9 4a16.6 16.6 0 0 0-4.2 1.3C2 9.3 1.3 13.2 1.6 17a16.9 16.9 0 0 0 5.1 2.6l1.1-1.7a10.9 10.9 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 11 0l.4.3c-.5.3-1.1.6-1.7.8l1.1 1.7a16.8 16.8 0 0 0 5.1-2.6c.4-4.4-.7-8.3-3.1-11.7zM8.5 14.7c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm7 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>
            <span data-bind="discord"></span>
        </div>
    </footer>
</div>
<script src="script.js"></script>
</body>
</html>
