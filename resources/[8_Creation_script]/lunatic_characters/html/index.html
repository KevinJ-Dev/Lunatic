<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Sélection de personnage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="select hidden" id="select">
        <aside class="panel">
            <header class="banner">
                <img class="banner-logo" src="logo.png" alt="">
                <div class="banner-text">
                    <span class="banner-title">Personnages</span>
                    <span class="banner-sub">Choisissez qui vous allez incarner</span>
                </div>
            </header>
            <main class="list" id="list"></main>
            <footer class="foot">
                <button class="play" id="play">Jouer</button>
            </footer>
        </aside>
        <div class="stage">
            <div class="server-id" id="server-id"></div>
            <div class="details" id="details"></div>
            <div class="name" id="name"></div>
        </div>
        <div class="toast" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
