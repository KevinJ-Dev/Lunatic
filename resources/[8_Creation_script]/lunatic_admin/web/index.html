<!-- Panel réduit : rappel discret en bas d'écran -->
<div class="mini-pill" id="miniPill"><img src="logo.png" alt=""><span>Panel staff réduit</span><kbd id="miniKey">F10</kbd></div>

<div class="app">
    <div class="window">
        <div class="sky"></div>
        <svg class="wave" viewBox="0 0 1600 400" preserveAspectRatio="none">
            <defs>
                <linearGradient id="wv1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: rgb(var(--accent-rgb)); stop-opacity: .05"/><stop offset=".6" style="stop-color: rgb(var(--accent-rgb)); stop-opacity: .22"/><stop offset="1" style="stop-color: rgb(var(--accent-rgb)); stop-opacity: .1"/></linearGradient>
                <linearGradient id="wv2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".25"/><stop offset=".55" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
            </defs>
            <path d="M0 260 C 300 230 500 300 800 250 S 1300 150 1600 200 L 1600 400 L 0 400 Z" fill="url(#wv1)"/>
            <path d="M0 300 C 350 330 600 330 900 290 S 1350 230 1600 270" fill="none" stroke="url(#wv2)" stroke-width="1.5"/>
        </svg>

        <div class="shell">
            <header class="topbar">
                <div class="brand-mini" title="Lunatic RP · Panel staff"><img src="logo.png" alt=""></div>
                <div class="tabbar" id="tabs"></div>
                <nav class="navbar" id="nav"></nav>
                <div class="top-right">
                    <button class="search-btn" id="searchBtn" title="Rechercher partout (Ctrl+K)"><svg class="i"><use href="#i-search"/></svg><kbd>Ctrl K</kbd></button>
                    <button class="search-btn help-btn" id="helpBtn" title="Aide de la page">?</button>
                    <div class="me-chip" id="me"></div>
                    <div class="win-controls">
                        <button class="win-btn" id="minimize" title="Réduire (F10 pour revenir)"><svg class="i"><use href="#i-minus"/></svg></button>
                        <button class="win-btn" id="maximize" title="Agrandir / réduire la fenêtre"><svg class="i"><use href="#i-maximize"/></svg></button>
                        <button class="win-btn close" id="close" title="Fermer (Échap)"><svg class="i"><use href="#i-x"/></svg></button>
                    </div>
                </div>
            </header>

            <div class="unsaved-bar" id="unsavedBar">
                <svg class="i"><use href="#i-warn"/></svg>
                <span><b>Modifications non enregistrées</b> · <span id="unsavedLabel"></span></span>
                <button class="btn small ghost" id="unsavedReset"><svg class="i"><use href="#i-undo"/></svg>Annuler</button>
                <button class="btn small primary" id="unsavedSave"><svg class="i"><use href="#i-save"/></svg>Enregistrer</button>
            </div>

            <main class="workspace">
                <section class="view" id="view-home"></section>
                <section class="view" id="view-dashboard"></section>
                <section class="view" id="view-players"></section>
                <section class="view" id="view-sanctions"></section>
                <section class="view" id="view-tools"></section>
                <section class="view" id="view-logs"></section>
                <section class="view" id="view-world"></section>
                <section class="view" id="view-server"></section>
                <section class="view" id="view-poles"></section>
                <section class="view" id="view-companies"></section>
                <section class="view" id="view-publics"></section>
                <section class="view" id="view-catalogs"></section>
                <section class="view" id="view-crews"></section>
                <section class="view" id="view-illegal"></section>
                <section class="view" id="view-events"></section>
                <section class="view" id="view-dev"></section>
                <section class="view" id="view-ranks"></section>
                <section class="view" id="view-members"></section>
            </main>
        </div>

        <div class="backdrop" id="backdrop"><div class="modal" id="modal"></div></div>
        <div class="toasts" id="toasts"></div>
    </div>
</div>

<!-- Avertissement reçu par un joueur : affiché même quand le panel est fermé -->
<div class="warning" id="warning">
    <div class="warning-card">
        <div class="warning-icon"><svg class="i"><use href="#i-warn"/></svg></div>
        <h2>Avertissement du staff</h2>
        <p class="warning-reason" id="warning-reason"></p>
        <p class="warning-meta" id="warning-meta"></p>
        <button class="btn primary wide" id="warning-ack">J'ai compris</button>
    </div>
</div>
