<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Lunatic - Création de personnage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="creator hidden" id="creator">
        <aside class="panel">
            <header class="banner">
                <img class="banner-logo" src="logo.png" alt="">
                <div class="banner-text">
                    <span class="banner-title">Nouveau personnage</span>
                    <span class="banner-sub">Création de personnage</span>
                </div>
            </header>
            <main class="step" id="step"></main>
            <footer class="foot">
                <button class="btn ghost" id="prev">Précédent</button>
                <button class="btn go" id="next">Suivant</button>
            </footer>
        </aside>
        <div class="stage" id="stage">
            <nav class="steps" id="steps"></nav>
            <div class="stage-foot">
                <div class="cams" id="cams"></div>
                <div class="hint">Clic maintenu et glisser : tourner le personnage</div>
            </div>
        </div>
        <aside class="side hidden" id="side">
            <header class="side-head" id="side-head"></header>
            <div class="side-body" id="side-body"></div>
        </aside>
        <div class="toast" id="toast"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
